[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkit-backend"
version = "1.0.0"
description = "CheckIT - Tender analysis platform backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg",
    "python-dotenv",
    "python-multipart",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "pydantic[email]>=2.0",
    "openpyxl",
    "pandas",
    "requests",
    "camelot-py[cv]",
    "pymupdf",
    "ocrmypdf",
    "selenium",
    "webdriver-manager",
    "psycopg2-binary",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scraper*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
